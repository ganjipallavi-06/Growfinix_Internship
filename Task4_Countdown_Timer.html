<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Premium Countdown Dashboard</title>
    
    <style>
        /* --- Global Reset & Premium Dark Palette --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 🌌 IMPRESSIVE BACKGROUND: Deep luxury cosmic foundation */
            background-color: #4ad2ea;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(232, 131, 183, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(137, 238, 194, 0.15) 0%, transparent 45%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* 🌌 IMPRESSIVE BACKGROUND: High-End Animated Dynamic Mesh Blobs */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            mix-blend-mode: screen;
        }
        
        .glow-1 {
            width: 450px;
            height: 450px;
            top: -10%;
            left: -5%;
            background: radial-gradient(circle,crisp white(235, 161, 23, 0.4) 0%, transparent 70%);
            animation: floatGlow1 12s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            bottom: -15%;
            right: -5%;
            background: radial-gradient(circle, rgba(0, 180, 216, 0.35) 0%, transparent 70%);
            animation: floatGlow2 15s infinite alternate ease-in-out;
        }

        /* Ambient subtle grid overlay for a high-tech developer aesthetic */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.005) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.005) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 2;
            pointer-events: none;
        }

        /* --- Glassmorphism Main Dashboard Card Container --- */
        .dashboard-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            padding: 45px 40px;
            /* High fidelity frosted glass recipe */
            background: rgba(11, 17, 32, 0.65); 
            backdrop-filter: blur(25px);          
            -webkit-backdrop-filter: blur(25px);  
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 32px;                  
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            z-index: 10;
            text-align: center;
        }

        h2 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(158, 169, 193, 0.8);
            font-size: 1.05rem;
            margin-bottom: 35px;
        }

        /* --- Multiple Event Selector Controls --- */
        .controls-row {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .dropdown-box, .custom-date-btn {
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-radius: 14px;
            outline: none;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .dropdown-box option {
            background-color: #0b111e;
            color: #ffffff;
        }

        .dropdown-box:focus, .custom-date-btn:hover {
            border-color: #00dfd8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 223, 216, 0.2);
        }

        /* Custom Manual Date Setter Input Area */
        .custom-input-group {
            display: none;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .date-input {
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .date-input:focus {
            border-color: #00dfd8;
        }

        /* --- Structured Counter Grid Blocks --- */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 24px 12px;
            border-radius: 20px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .time-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 223, 216, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .number {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00dfd8, #007cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 223, 216, 0.3));
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .label {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(158, 169, 193, 0.6);
            font-weight: 600;
        }

        /* --- Celebratory Zero-State Banner --- */
        .celebration-message {
            display: none;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff527b, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 82, 123, 0.4));
            margin: 25px 0;
            animation: pulse 1.5s infinite;
        }

        /* --- Action Controls --- */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-primary {
            background: #00b4d8;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 180, 216, 0.25);
        }

        .btn-primary:hover {
            background: #00dfd8;
            color: #060913;
            box-shadow: 0 8px 25px rgba(0, 223, 216, 0.4);
            transform: translateY(-2px);
        }

        /* Paused visual skin modifier classes */
        .paused-state .number {
            background: linear-gradient(135deg, #b5179e, #7209b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(181, 23, 158, 0.3));
        }

        /* --- Core Keyframe Animations --- */
        @keyframes floatGlow1 {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(-5px, -40px) scale(1.15); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* --- Responsive Screen Adaptations --- */
        @media (max-width: 600px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .number { font-size: 2.4rem; }
            h2 { font-size: 1.9rem; }
            .dashboard-container { padding: 35px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="dashboard-container" id="timerDashboard">
        <h2 id="eventTitle">Countdown Matrix</h2>
        <p class="subtitle" id="eventDateLine">Tracking upcoming milestone moments</p>

        <div class="controls-row">
            <select class="dropdown-box" id="eventSelector">
                <option value="2027-01-01T00:00:00">🎉 New Year 2027</option>
                <option value="2027-02-20T14:00:00">🎉 My BIRTHDAY 2027</option>
                <option value="2026-09-15T09:00:00">🚀 Tech Innovators Summit 2026</option>
                <option value="2026-11-20T18:00:00">💻 Web Dev Hackathon 2026</option>
                <option value="CUSTOM">⚙️ Set Custom Date...</option>
            </select>
        </div>

        <div class="custom-input-group" id="customInputArea">
            <input type="datetime-local" class="date-input" id="customDateTime">
            <button class="custom-date-btn" id="applyCustomBtn">Launch</button>
        </div>

        <div class="countdown-grid" id="clockGrid">
            <div class="time-box">
                <div class="number" id="daysBox">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="number" id="hoursBox">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutesBox">00</div>
                <div class="label">Mins</div>
            </div>
            <div class="time-box">
                <div class="number" id="secondsBox">00</div>
                <div class="label">Secs</div>
            </div>
        </div>

        <div class="celebration-message" id="zeroStateBanner">EVENT LIVE! 🎉</div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="pauseResumeBtn">Pause Timer</button>
        </div>
    </div>

    <script>
        const eventSelector = document.getElementById('eventSelector');
        const customInputArea = document.getElementById('customInputArea');
        const customDateTime = document.getElementById('customDateTime');
        const applyCustomBtn = document.getElementById('applyCustomBtn');
        
        const eventTitle = document.getElementById('eventTitle');
        const eventDateLine = document.getElementById('eventDateLine');
        const clockGrid = document.getElementById('clockGrid');
        const zeroStateBanner = document.getElementById('zeroStateBanner');
        const pauseResumeBtn = document.getElementById('pauseResumeBtn');
        const timerDashboard = document.getElementById('timerDashboard');

        const daysBox = document.getElementById('daysBox');
        const hoursBox = document.getElementById('hoursBox');
        const minutesBox = document.getElementById('minutesBox');
        const secondsBox = document.getElementById('secondsBox');

        let countdownInterval = null;
        let targetTargetDate = null;
        let isPaused = false;
        let cachedTimeRemaining = 0; 

        updateTargetFromSelector();

        eventSelector.addEventListener('change', () => {
            if (eventSelector.value === 'CUSTOM') {
                customInputArea.style.display = 'flex';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                customDateTime.value = now.toISOString().slice(0,16);
            } else {
                customInputArea.style.display = 'none';
                isPaused = false;
                pauseResumeBtn.innerText = "Pause Timer";
                timerDashboard.classList.remove('paused-state');
                updateTargetFromSelector();
            }
        });

        applyCustomBtn.addEventListener('click', () => {
            if (customDateTime.value) {
                targetTargetDate = new Date(customDateTime.value);
                eventTitle.innerText = "Custom Tracked Event";
                eventDateLine.innerText = targetTargetDate.toLocaleString();
                isPaused = false;
                pauseResumeBtn.innerText = "Pause Timer";
                timerDashboard.classList.remove('paused-state');
                initiateTicker();
            } else {
                alert("Please select a valid upcoming date and time!");
            }
        });

        function updateTargetFromSelector() {
            const selectedOption = eventSelector.options[eventSelector.selectedIndex];
            targetTargetDate = new Date(eventSelector.value);
            eventTitle.innerText = selectedOption.text.substring(3); 
            eventDateLine.innerText = targetTargetDate.toLocaleString();
            initiateTicker();
        }

        function initiateTicker() {
            clearInterval(countdownInterval);
            renderTimeCycle();
            countdownInterval = setInterval(() => {
                if (!isPaused) {
                    renderTimeCycle();
                }
            }, 1000);
        }

        function renderTimeCycle() {
            const rightNow = new Date().getTime();
            let distance = targetTargetDate.getTime() - rightNow;

            if (isPaused) {
                distance = cachedTimeRemaining;
            } else {
                cachedTimeRemaining = distance; 
            }

            if (distance <= 0) {
                clearInterval(countdownInterval);
                clockGrid.style.display = 'none';
                zeroStateBanner.style.display = 'block';
                pauseResumeBtn.style.display = 'none';
                return;
            }

            clockGrid.style.display = 'grid';
            zeroStateBanner.style.display = 'none';
            if (eventSelector.value !== 'CUSTOM' || customDateTime.value) {
                pauseResumeBtn.style.display = 'block';
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysBox.innerText = prependZeroFormatter(days);
            hoursBox.innerText = prependZeroFormatter(hours);
            minutesBox.innerText = prependZeroFormatter(minutes);
            secondsBox.innerText = prependZeroFormatter(seconds);
        }

        function prependZeroFormatter(num) {
            return num < 10 ? "0" + num : num;
        }

        pauseResumeBtn.addEventListener('click', () => {
            if (!isPaused) {
                isPaused = true;
                pauseResumeBtn.innerText = "Resume Timer";
                timerDashboard.classList.add('paused-state');
            } else {
                isPaused = false;
                pauseResumeBtn.innerText = "Pause Timer";
                timerDashboard.classList.remove('paused-state');
                const currentSystemTime = new Date().getTime();
                targetTargetDate = new Date(currentSystemTime + cachedTimeRemaining);
                eventDateLine.innerText = targetTargetDate.toLocaleString();
            }
        });
    </script>
</body>
</html>
